# Saves the Canva export into the repo as image.jpg as soon as the daily agent
# commits a post.json, because Canva's download links expire within hours.
# The daily email links to this file.
name: Fetch image

on:
  push:
    branches: [main]
    paths: ['posts/**/post.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-image
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-image.mjs
      - name: Commit image
        run: |
          git add posts
          if git diff --cached --quiet; then echo "No new images."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add exported image [skip ci]"
          git pull --rebase origin main
          git push
