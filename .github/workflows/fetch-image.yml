# Saves the Canva export into the post PR as image.jpg, so the image is
# reviewable in the PR and still available after Canva's link expires.
name: Fetch image

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['posts/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    # Only PRs from branches in this repo (the daily agent's) can be written to.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-image.mjs
      - name: Commit image
        run: |
          git add posts
          if git diff --cached --quiet; then echo "No new images."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add exported image"
          git push
