# Instagram long-lived tokens expire after 60 days unless refreshed.
# Refreshes weekly and stores the new token back into the repo secret.
# Needs a SECRETS_PAT secret: a fine-grained token for this repo with
# "Secrets: Read and write" permission (see README).
name: Refresh Instagram token

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh and store token
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SECRETS_PAT is not set, so the refreshed token cannot be saved. See README."
            exit 1
          fi
          NEW_TOKEN="$(node scripts/refresh-token.mjs)"
          echo "::add-mask::$NEW_TOKEN"
          gh secret set INSTAGRAM_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW_TOKEN"
